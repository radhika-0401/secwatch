[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secwatch"
version = "1.0.0"
description = "Security detection engineering, Linux hardening, and Terraform IaC auditing toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["security", "detection-engineering", "mitre-attack", "cis-benchmark", "terraform", "cloudtrail"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "bandit>=1.7"]

[project.scripts]
secwatch = "secwatch.cli:main"

[tool.setuptools.packages.find]
include = ["secwatch*"]

[tool.setuptools.package-data]
secwatch = ["rules/*.yml"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # asserts are fine in tests; long lines are HTML templates and sample data

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"]  # non-cryptographic random is intended for sample data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
