name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-sast:
    name: Lint and SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Bandit (static security analysis)
        run: bandit -c pyproject.toml -r secwatch

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Fix fixture permissions (git does not store them)
        run: chmod 644 sample_data/linux_root/etc/shadow
      - run: pytest --cov=secwatch --cov-report=term-missing

  security-scan:
    name: SecWatch scan and security gate
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Detect threats in sample logs
        run: >
          secwatch detect --auth sample_data/auth.log --web sample_data/access.log
          --cloudtrail sample_data/cloudtrail.json --year 2026 -o reports -f json,md,html
      - name: Audit sample Linux host
        run: secwatch harden --root sample_data/linux_root -o reports
      - name: Scan intentionally insecure Terraform (demo, findings expected)
        run: secwatch iac --plan sample_data/tfplan.json -o reports -f json,md,html,sarif
      - name: Security gate on hardened Terraform (fails build on medium+)
        run: secwatch iac --plan sample_data/tfplan_secure.json -o reports/secure --fail-on medium
      - name: Upload SARIF to GitHub code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/iac.sarif
          category: secwatch-iac
      - uses: actions/upload-artifact@v4
        with:
          name: secwatch-reports
          path: reports/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secwatch:ci .
      - name: Run scanner in container
        run: docker run --rm -v "$PWD:/work" secwatch:ci iac --plan sample_data/tfplan_secure.json -o /tmp/reports --fail-on low